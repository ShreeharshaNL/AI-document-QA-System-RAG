version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: rag-postgres-vector
    environment:
      POSTGRES_DB: rag_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: rag-fastapi-service
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@db:5432/rag_db
      SECRET_KEY: supersecretjwtkeyforragdocumentsystem2026
      EMBEDDING_MODEL: bge-small-en-v1.5
    depends_on:
      - db

volumes:
  pgvector_data:
